version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: garnish-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: garnish
      POSTGRES_PASSWORD: garnish123
      POSTGRES_DB: garnish_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: garnish-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data: