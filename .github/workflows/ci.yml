name: CI

on:
  push:
    branches: [master]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: lint · build · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.1.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --dir apps/server exec prisma generate

      # Blocking gate: a broken build fails CI.
      - name: Build
        run: pnpm build

      # Blocking gate (GARNISH-COVERAGE-03): fails CI if a Recipe field or a
      # non-internal endpoint exists in code but is missing from the coverage
      # registry (UNREGISTERED), or a registry frontend:<ref> is no longer
      # routed/called/rendered (UNMAPPED). Prevents silent backend↔frontend drift.
      - name: Coverage gate
        run: pnpm coverage:check

      # Non-blocking for now — tracked as R20 (lint/format debt: residual
      # prettier/CRLF + @typescript-eslint/no-unsafe-* warnings; pnpm lint exits 0
      # but the format-pass close is deferred). Remove continue-on-error once that
      # backlog is cleared.
      - name: Lint
        run: pnpm lint
        continue-on-error: true

      # Blocking gate: tests must pass. R19 is CLOSED (GREENBUILD-02) — the suite
      # is green (142 suites / 1152 tests, 0 failures), so a test failure now fails CI.
      - name: Test
        run: pnpm test

  secret-scan:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
